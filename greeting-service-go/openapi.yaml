openapi: "3.0.0"
info:
  title: Student Service
  version: 1.0.0
paths:
  /students/quick:
    post:
      summary: Quickly create a student
      responses:
        '200':
          description: Student created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
  /students:
    post:
      summary: Create a student
      responses:
        '200':
          description: Student created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
components:
  schemas:
    Student:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
